name: SEO compliance

on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.json'
      - '**/*.js'
      - '**/*.css'
      - 'netlify.toml'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'tools/**'
      - 'scripts/**'
      - 'seo-meta.json'
      - '.github/workflows/seo-compliance.yml'
  push:
    branches: [master]
    paths:
      - '**/*.html'
      - '**/*.json'
      - '**/*.js'
      - '**/*.css'
      - 'netlify.toml'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'tools/**'
      - 'scripts/**'
      - 'seo-meta.json'
      - '.github/workflows/seo-compliance.yml'
  workflow_dispatch:

jobs:
  seo-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so sitemap lastmod uses real commit dates
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build exactly what Netlify deploys (sync + all checks + dist/)
        run: node ./tools/build.js
      - name: Fail if the committed HTML is out of sync with the data files
        run: |
          git diff --stat -- . ':(exclude)sitemap.xml' ':(exclude)llms-full.txt'
          if ! git diff --quiet -- . ':(exclude)sitemap.xml' ':(exclude)llms-full.txt'; then
            echo "::error::Generated HTML differs from the commit. Run 'node tools/build.js --no-dist' locally and commit the result."
            exit 1
          fi
      - name: Crawl the built site (not production) for broken links
        run: |
          npx --yes http-server@14.1.1 dist -p 8080 -s &
          sleep 3
          npx --yes linkinator@6.1.2 "http://localhost:8080/" --recurse \
            --skip "instagram|goo.gl|reddit|medium.com|wa.me|khadeejadesigns\\.in|facebook|google|clarity|formspree"
