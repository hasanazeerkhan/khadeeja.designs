name: SEO compliance

on:
  pull_request:
  push:
    branches: [master]

jobs:
  seo-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run compliance checks
        run: node ./seo-compliance.js
