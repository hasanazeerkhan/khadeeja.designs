  <script>
    const POSTS_PER_PAGE = 9;
    let allBlogs = [];
    let currentFilter = 'all';
    let currentPage = 1;

    // Blog categories mapping
    const blogCategories = {
      'aari-trends-2026': ['trends'],
      'care-hand-embroidered-blouse': ['tips'],
      'pinterest-to-reality-custom-design': ['techniques'],
      'art-of-aari-hand-vs-machine': ['techniques'],
      'types-of-aari-stitches': ['techniques'],
      'handcrafted-aari-indian-heritage': ['heritage']
    };

    // Load and display blogs
    async function loadBlogs() {
      try {
        const response = await fetch('../blogs/blogs.json');
        if (!response.ok) throw new Error('Failed to load blogs');
        
        allBlogs = await response.json();
        displayBlogs();
        setupFilterButtons();
      } catch (error) {
        console.error('Error loading blogs:', error);
        document.getElementById('blog-grid').innerHTML = '<p class="text-red-300">Error loading blog posts.</p>';
      }
    }

    // Display blogs based on filter
    function displayBlogs() {
      const filteredBlogs = currentFilter === 'all' 
        ? allBlogs 
        : allBlogs.filter(blog => {
            const categories = blogCategories[blog.slug] || [];
            return categories.includes(currentFilter);
          });

      const startIdx = (currentPage - 1) * POSTS_PER_PAGE;
      const endIdx = startIdx + POSTS_PER_PAGE;
      const paginatedBlogs = filteredBlogs.slice(startIdx, endIdx);

      const blogGrid = document.getElementById('blog-grid');
      
      if (paginatedBlogs.length === 0) {
        blogGrid.innerHTML = '<p class="col-span-full text-center text-neutral-400 py-12">No posts found in this category.</p>';
        return;
      }

      blogGrid.innerHTML = paginatedBlogs.map(blog => `
        <article class="blog-card bg-neutral-800/50 rounded-lg overflow-hidden">
          <div class="aspect-video overflow-hidden bg-neutral-900">
            <img src="./${blog.image}" alt="${blog.title}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300" loading="lazy" />
          </div>
          <div class="p-6">
            <div class="flex gap-2 mb-3 flex-wrap">
              ${(blogCategories[blog.slug] || []).map(cat => `
                <span class="text-xs px-3 py-1 rounded-full bg-amber-400/20 text-amber-300">${cat}</span>
              `).join('')}
            </div>
            <h3 class="font-semibold text-lg mb-2 line-clamp-2 hover:text-amber-400 transition">
              <a href="../blogs/blogs.html?post=${blog.slug}">${blog.title}</a>
            </h3>
            <p class="text-sm text-neutral-400 mb-4 line-clamp-2">${blog.excerpt || 'Click to read more...'}</p>
            <div class="flex justify-between items-center text-xs text-neutral-500">
              <span>${blog.date}</span>
              <span>${blog.readTime}</span>
            </div>
            <a href="../blogs/blogs.html?post=${blog.slug}" class="mt-4 inline-block text-amber-400 font-semibold text-sm hover:text-amber-300">Read Article →</a>
          </div>
        </article>
      `).join('');
    }

    // Setup filter buttons
    function setupFilterButtons() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.dataset.filter;
          currentPage = 1;
          displayBlogs();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    // Load blogs on page load
    document.addEventListener('DOMContentLoaded', loadBlogs);
  </script>
