  <script>
    // Blog-specific: Load post content
    const slug = new URLSearchParams(window.location.search).get("post");

    fetch("./blogs.json")
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status} loading blogs.json`);
        return r.json();
      })
      .then(list => {
        const b = list.find(x => x.slug === slug) || list[0];

        if (!b) throw new Error("Blog post not found");

        document.getElementById("post-title").textContent = b.title;
        document.getElementById("post-date").textContent = `${b.date} • ${b.readTime}`;
        const img = document.getElementById("post-image");
        img.src = b.image;
        img.alt = b.title;

        return fetch(b.content);
      })
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status} loading markdown content`);
        return res.text();
      })
      .then(md => {
        document.getElementById("post-content").innerHTML = marked.parse(md);
      })
      .catch(err => {
        console.error("Error loading blog:", err);
        document.getElementById("post-content").innerHTML = '<p class="text-red-300 text-center py-8">Error loading blog content. Please try refreshing the page.</p>';
      });
  </script>
