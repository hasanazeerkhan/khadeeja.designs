<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Khadeeja Designs</title>
<meta name="description" content="View embroidery design details and send your enquiry.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css">
<style>
body{display:flex;flex-direction:column;min-height:100vh;}
main{flex:1;}
.detail-wrap{padding:0 52px 60px;}
.breadcrumb{display:flex;align-items:center;gap:8px;padding:22px 0 32px;font-family:var(--sans);font-size:12px;color:var(--t3);}
.bc-link{cursor:pointer;transition:color 0.2s;text-decoration:none;color:var(--t3);}
.bc-link:hover{color:var(--t2);}
.bc-sep{font-size:10px;}
.bc-cur{color:var(--t2);}

.detail-layout{display:grid;grid-template-columns:1fr 1px 1fr;}
.v-rule{background:var(--border);}
.detail-left{padding-right:52px;}
.detail-right{padding-left:52px;}

.main-img-box{width:100%;aspect-ratio:4/3;overflow:hidden;background:#111;margin-bottom:12px;}
.main-img-box img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity 0.3s;}
.img-ph{width:100%;height:100%;background:#141414;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
.img-ph svg{opacity:0.1;}
.img-ph span{font-family:var(--sans);font-size:10px;color:var(--t3);letter-spacing:0.12em;text-transform:uppercase;}

.img-nav{display:flex;align-items:center;justify-content:space-between;padding:0 2px;}
.img-dots{display:flex;gap:6px;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--t3);cursor:pointer;transition:background 0.2s;border:none;}
.dot.on{background:var(--gold);}
.img-count{font-family:var(--sans);font-size:11px;color:var(--t3);}
.thumb-strip{display:flex;gap:8px;margin-top:12px;}
.thumb{width:64px;height:64px;background:#141414;border:1px solid var(--border);cursor:pointer;overflow:hidden;transition:border-color 0.2s;flex-shrink:0;}
.thumb.on{border-color:var(--gold);}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.thumb-ph span{font-family:var(--sans);font-size:9px;color:#2a2a2a;text-align:center;}

.detail-cat{font-family:var(--sans);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:block;}
.detail-title{font-family:var(--serif);font-size:36px;font-weight:300;line-height:1.12;color:var(--t1);margin-bottom:14px;}
.detail-title em{font-style:italic;}
.rating-row{display:flex;align-items:center;gap:8px;margin-bottom:18px;}
.stars{color:var(--gold);font-size:13px;letter-spacing:3px;}
.rating-n{font-family:var(--sans);font-size:13px;color:var(--t2);}

.price-bar{display:flex;align-items:baseline;gap:14px;padding:16px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:22px;}
.dp-old{font-family:var(--sans);font-size:13px;color:var(--t3);text-decoration:line-through;}
.dp-new{font-family:var(--sans);font-size:22px;font-weight:500;color:var(--t1);}
.dp-save{font-family:var(--sans);font-size:11px;background:var(--gold-dim);color:var(--gold);padding:3px 9px;}

.detail-summary{font-family:var(--serif);font-size:16px;font-weight:400;line-height:1.6;color:#ccc;margin-bottom:12px;}
.detail-body{font-family:var(--sans);font-size:13px;font-weight:300;line-height:1.8;color:var(--t2);margin-bottom:26px;}

.spec-table{margin-bottom:28px;}
.spec-row{display:flex;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--border);gap:16px;}
.spec-row:first-child{border-top:1px solid var(--border);}
.spec-k{font-family:var(--sans);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3);min-width:96px;}
.spec-v{font-family:var(--sans);font-size:13px;color:var(--t2);}

/* Single CTA */
.make-yours-btn{
  width:100%;padding:17px;
  background:var(--gold);color:var(--black);border:none;
  font-family:var(--sans);font-size:15px;font-weight:500;
  letter-spacing:0.05em;cursor:pointer;
  transition:background 0.2s,transform 0.1s;
  margin-bottom:14px;
}
.make-yours-btn:hover{background:var(--gold-light);}
.make-yours-btn:active{transform:scale(0.99);}
.cta-hint{display:flex;align-items:center;gap:8px;}
.cta-hint-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;}
.cta-hint-txt{font-family:var(--sans);font-size:12px;color:var(--t3);}

.error-state{padding:80px 52px;text-align:center;font-family:var(--sans);font-size:14px;color:var(--t2);}
.error-state a{color:var(--gold);}

@media(max-width:900px){
  .detail-wrap{padding:0 20px 48px;}
  .detail-layout{grid-template-columns:1fr;}
  .v-rule{display:none;}
  .detail-left{padding-right:0;margin-bottom:32px;}
  .detail-right{padding-left:0;}
}
</style>
</head>
<body>
<nav>
  <a class="brand" href="/">Khadeeja Designs</a>
  <div class="nav-center"></div>
  <button class="hamburger"><span></span><span></span><span></span></button>
</nav>

<main>
  <div class="detail-wrap" id="detail-wrap">
    <div class="breadcrumb">
      <a class="bc-link" href="/">Home</a>
      <span class="bc-sep">/</span>
      <a class="bc-link" href="/explore/">Explore Design</a>
      <span class="bc-sep">/</span>
      <span class="bc-cur" id="bc-name">Loading…</span>
    </div>

    <div class="detail-layout">
      <div class="detail-left">
        <div class="main-img-box" id="main-img-box">
          <div class="img-ph">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="white" stroke-width="1" stroke-linecap="round">
              <rect x="3" y="8" width="34" height="26" rx="2"/>
              <circle cx="14" cy="18" r="4"/>
              <path d="M3 29l9-7 7 5 6-4 12 7"/>
            </svg>
            <span>Loading…</span>
          </div>
        </div>
        <div class="img-nav">
          <div class="img-dots" id="dots"></div>
          <span class="img-count" id="img-count">— / —</span>
        </div>
        <div class="thumb-strip" id="thumbs"></div>
      </div>

      <div class="v-rule"></div>

      <div class="detail-right">
        <span class="detail-cat" id="d-cat"></span>
        <h1 class="detail-title" id="d-title"></h1>
        <div class="rating-row">
          <span class="stars">★★★★★</span>
          <span class="rating-n" id="d-rating">4.9</span>
        </div>
        <div class="price-bar">
          <span class="dp-old" id="d-old"></span>
          <span class="dp-new" id="d-new"></span>
          <span class="dp-save" id="d-save"></span>
        </div>
        <p class="detail-summary" id="d-summary"></p>
        <p class="detail-body" id="d-body"></p>
        <div class="spec-table" id="d-specs"></div>
        <button class="make-yours-btn" id="cta-btn">Make It Yours →</button>
        <div class="cta-hint">
          <div class="cta-hint-dot"></div>
          <span class="cta-hint-txt">We reply within 48 hours with pricing and next steps</span>
        </div>
      </div>
    </div>
  </div>
</main>

<footer></footer>
<script src="../shared-nav.js"></script>
<script>
initPage('explore');

const params = new URLSearchParams(window.location.search);
const productId = params.get('id');
let productImages = [];
let currentProductId = '';

async function loadProduct() {
  if (!productId) { showError(); return; }
  try {
    const res = await fetch(`designs/products/${productId}/product.json`);
    if (!res.ok) throw new Error('not found');
    const p = await res.json();
    currentProductId = p.id;
    render(p);

    /* update page title */
    document.title = `${p.title} — Khadeeja Designs`;

    /* Meta ViewContent */
    if (typeof fbq !== 'undefined') {
      fbq('track', 'ViewContent', {
        content_name: p.tag, content_category: p.category,
        content_ids: [p.id], currency: 'INR',
        value: parseFloat(p.newPrice.replace(/[^0-9.]/g,''))
      });
    }
    /* GA4 view_item */
    if (typeof gtag !== 'undefined') {
      gtag('event','view_item',{
        currency:'INR',
        value: parseFloat(p.newPrice.replace(/[^0-9.]/g,'')),
        items:[{item_id:p.id, item_name:p.tag, item_category:p.category}]
      });
    }
  } catch(e) { showError(); }
}

function render(p) {
  document.getElementById('bc-name').textContent = p.title;
  document.getElementById('d-cat').textContent =
    p.category.charAt(0).toUpperCase() + p.category.slice(1) + ' Collection';

  /* italic last word of title */
  const words = p.title.split(' ');
  const last = words.pop();
  document.getElementById('d-title').innerHTML = `${words.join(' ')}<br><em>${last}</em>`;

  document.getElementById('d-rating').textContent = p.rating;
  document.getElementById('d-old').textContent = p.oldPrice;
  document.getElementById('d-new').textContent = p.newPrice;
  document.getElementById('d-save').textContent = `Save ₹${p.saving}`;
  document.getElementById('d-summary').textContent = p.summary;
  document.getElementById('d-body').textContent = p.description;

  const specs = [
    ['Category', p.specs.category],
    ['Work type', p.specs.workType],
    ['Timeline',  p.specs.timeline + ' after design brief'],
    ['Delivery',  'Pan India · Tracked shipping']
  ];
  document.getElementById('d-specs').innerHTML = specs.map(([k,v]) =>
    `<div class="spec-row"><span class="spec-k">${k}</span><span class="spec-v">${v}</span></div>`
  ).join('');

  /* ── CTA: pass design tag + id to contact page ── */
  document.getElementById('cta-btn').onclick = () => {
    const qs = new URLSearchParams({ design: p.tag, id: p.id });
    window.location.href = `../contact/?${qs}`;
  };

  /* images */
  productImages = p.images && p.images.length ? p.images : ['main.jpg'];
  buildGallery(p.id, productImages);
}

function buildGallery(id, images) {
  setMainImg(id, images, 0);
  document.getElementById('img-count').textContent = `1 / ${images.length}`;
  document.getElementById('dots').innerHTML = images.map((_, i) =>
    `<button class="dot${i===0?' on':''}" onclick="switchImg(${i})"></button>`
  ).join('');
  document.getElementById('thumbs').innerHTML = images.map((img, i) =>
    `<div class="thumb${i===0?' on':''}" onclick="switchImg(${i})">
       <img src="designs/products/${id}/${img}" alt="View ${i+1}"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
       <div class="thumb-ph" style="display:none;"><span>${i+1}</span></div>
     </div>`
  ).join('');
}

function setMainImg(id, images, idx) {
  document.getElementById('main-img-box').innerHTML =
    `<img src="designs/products/${id}/${images[idx]}" alt="View ${idx+1}"
       onerror="this.style.display='none';this.insertAdjacentHTML('afterend',
       '<div class=\\'img-ph\\'><svg width=\\'40\\' height=\\'40\\' viewBox=\\'0 0 40 40\\' fill=\\'none\\' stroke=\\'white\\' stroke-width=\\'1\\' stroke-linecap=\\'round\\'><rect x=\\'3\\' y=\\'8\\' width=\\'34\\' height=\\'26\\' rx=\\'2\\'/></svg><span>Photo ${idx+1}</span></div>')">`;
}

function switchImg(idx) {
  setMainImg(currentProductId, productImages, idx);
  document.getElementById('img-count').textContent = `${idx+1} / ${productImages.length}`;
  document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('on', i===idx));
  document.querySelectorAll('.thumb').forEach((t,i) => t.classList.toggle('on', i===idx));
}

function showError() {
  document.getElementById('detail-wrap').innerHTML =
    `<div class="error-state"><p>Design not found. <a href="/explore/">Browse all designs →</a></p></div>`;
}

loadProduct();
</script>
</body>
</html>
