# netlify.toml
# Enables clean URLs with folder structure
# /explore/ → /explore/index.html (automatic)
# /blog/ → /blog/index.html (automatic)
# etc.

[build]
  # Syncs shared blocks, runs the SEO/HTML/price checks (a failure blocks the deploy),
  # then publishes only public files from dist/ (no README, scripts, tools or reports).
  command = "node tools/build.js"
  publish = "dist"
  # Save build credits: skip the build when a push only changes files that never reach the
  # live site. Exit 0 = skip, non-zero = build. With no previous build to compare against
  # (CACHED_COMMIT_REF empty) the test fails, so the site always builds.
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)README.md' ':(exclude)SEO-IMPLEMENTATION-REPORT.md' ':(exclude).github' ':(exclude)tools/make-og-images.py'"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
    # Report-only first: watch the browser console for violations, then rename to Content-Security-Policy.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.clarity.ms https://*.clarity.ms https://connect.facebook.net https://www.googletagmanager.com; connect-src 'self' https://formspree.io https://*.clarity.ms https://www.facebook.com https://connect.facebook.net https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: https://www.facebook.com https://*.clarity.ms https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io; object-src 'none'"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Canonicalize alternate hostnames while preserving the requested path.
[[redirects]]
  from = "https://khadeejadesigns.netlify.app/*"
  to = "https://khadeejadesigns.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.khadeejadesigns.in/*"
  to = "https://khadeejadesigns.in/:splat"
  status = 301
  force = true

# Redirect /blog to /blog/ for consistency
[[redirects]]
  from = "/blog"
  to   = "/blog/"
  status = 301

# Redirect /explore to /explore/ for consistency
[[redirects]]
  from = "/explore"
