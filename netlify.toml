# netlify.toml
# Enables clean URLs — visitors see /faq not /faq.html
# Also handles /blog/ subfolder correctly

[build]
  publish = "."

[[redirects]]
  from = "/blog"
  to   = "/blog/"
  status = 301

# Pretty URLs: /page → /page.html (served transparently, URL stays clean)
[[redirects]]
  from   = "/*"
  to     = "/:splat.html"
  status = 200
  conditions = {Language = ["en"]}

# Fallback for any path not matched above
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
