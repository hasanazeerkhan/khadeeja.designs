# netlify.toml
# Enables clean URLs with folder structure
# /explore/ → /explore/index.html (automatic)
# /blog/ → /blog/index.html (automatic)
# etc.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Canonicalize alternate hostnames while preserving the requested path.
[[redirects]]
  from = "https://www.khadeejadesigns.in/*"
  to = "https://khadeejadesigns.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://khadeejadesigns.netlify.app/*"
  to = "https://khadeejadesigns.in/:splat"
  status = 301
  force = true

# Redirect /blog to /blog/ for consistency
[[redirects]]
  from = "/blog"
  to   = "/blog/"
  status = 301

# Redirect /explore to /explore/ for consistency
[[redirects]]
  from = "/explore"
  to   = "/explore/"
  status = 301

# Redirect /faq to /faq/ for consistency
[[redirects]]
