# netlify.toml
# Enables clean URLs with folder structure
# /explore/ → /explore/index.html (automatic)
# /blog/ → /blog/index.html (automatic)
# etc.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirect /blog to /blog/ for consistency
[[redirects]]
  from = "/blog"
  to   = "/blog/"
  status = 301

# Redirect /explore to /explore/ for consistency
[[redirects]]
  from = "/explore"
  to   = "/explore/"
  status = 301

# Redirect /faq to /faq/ for consistency
[[redirects]]
  from = "/faq"
  to   = "/faq/"
  status = 301

# Redirect /contact to /contact/ for consistency
[[redirects]]
  from = "/contact"
  to   = "/contact/"
  status = 301

# Redirect /privacy to /privacy/ for consistency
[[redirects]]
  from = "/privacy"
  to   = "/privacy/"
  status = 301

# Redirect /thankyou to /thankyou/ for consistency
[[redirects]]
  from = "/thankyou"
  to   = "/thankyou/"
  status = 301

# Redirect /product to /product/ for consistency
[[redirects]]
  from = "/product"
  to   = "/product/"
  status = 301

# Serve a real not-found page for unmatched routes instead of making every URL
# look like the homepage to crawlers.
[[redirects]]
  from = "/*"
  to   = "/404.html"
  status = 404
